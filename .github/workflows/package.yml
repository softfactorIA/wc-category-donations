name: Build plugin zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify header version matches tag
        run: |
          header="$(grep -m1 'Version:' wc-category-donations.php | grep -o '[0-9][0-9.]*' | head -1)"
          if [ "$header" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Plugin header Version ($header) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Build zip
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import os
          import sys
          import zipfile

          version = sys.argv[1]
          out = f"wc-category-donations-{version}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if not d.startswith(".")]
                  files = [f for f in files if not f.startswith(".") and f != out]
                  for name in files:
                      full = os.path.join(root, name)
                      rel = os.path.join("wc-category-donations", os.path.relpath(full, "."))
                      zf.write(full, rel)
          print(f"Created {out}")
          PY

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wc-category-donations-${{ steps.version.outputs.version }}.zip
          path: wc-category-donations-${{ steps.version.outputs.version }}.zip

      - name: Extract release notes from changelog
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            /^## \[/ {
              if (index($0, "[" v "]") > 0) { on = 1; next }
              if (on) exit
            }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no changelog section for version $version"
            exit 1
          fi
          echo "notes-file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "wc-category-donations-${{ steps.version.outputs.version }}.zip" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.notes.outputs.notes-file }}"